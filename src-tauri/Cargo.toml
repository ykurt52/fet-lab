[package]
name = "fet-lab"
version = "1.0.0"
description = "FET Lab: interactive transistor and MOSFET driving lab"
authors = ["Yunus Kurt"]
license = "MIT"
repository = "https://github.com/ykurt52/fet-lab"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# small, single-file release binary
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
